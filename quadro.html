<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#ffd6e7" />
  <title>O quadro 🎨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="quadro.css?v=5" />
</head>
<body>
  <main id="app">
    <a id="btn-sair" class="escondido" href="index.html?pausa" aria-label="Voltar ao quarto">←</a>
    <header>
      <h1 id="titulo"></h1>
      <p id="dica"></p>
    </header>

    <div id="moldura">
      <svg id="tela" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" aria-label="Quadro para pintar"></svg>
    </div>

    <div id="paleta" aria-label="Cores"></div>

    <div id="fim" class="escondido">
      <div class="card">
        <div class="emoji">🖼️💖</div>
        <h2 id="fim-titulo"></h2>
        <p id="fim-texto"></p>
        <button id="btn-fim"></button>
      </div>
    </div>

    <div id="toast" class="escondido"></div>
  </main>

  <script src="quadro.js?v=5"></script>
</body>
</html>
